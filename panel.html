<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #000; color: #d4af37; font-family: Arial, sans-serif; padding: 20px; }
        h1 { border-bottom: 2px solid #d4af37; padding-bottom: 10px; font-size: 24px; text-transform: uppercase; }
        .dato { border-bottom: 1px solid #333; padding: 10px; font-size: 14px; color: #fff; }
        a { color: #d4af37; font-weight: bold; margin-top: 20px; display: block; }
    </style>
</head>
<body>
    <h1>Panel de Datos</h1>
    {% for linea in datos %}
        <div class="dato">{{ linea }}</div>
    {% endfor %}
    <a href="/logout">Cerrar Sesión</a>
</body>
</html>
