<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #000; color: #d4af37; font-family: sans-serif; padding: 20px; }
        h1 { border-bottom: 1px solid #d4af37; padding-bottom: 10px; }
        .dato { border-bottom: 1px solid #333; padding: 5px; font-size: 14px; }
        a { color: #d4af37; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Panel de Datos</h1>
    {% for linea in datos %}
        <div class="dato">{{ linea }}</div>
    {% endfor %}
    <a href="/logout">Cerrar Sesión</a>
</body>
</html>
