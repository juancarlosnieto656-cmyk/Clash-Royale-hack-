<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PANEL DE CONTROL</title>
    <style>
        /* ESTILO INTEGRADO - NO DEPENDE DE NADA MAS */
        body {
            background-color: #000000 !important;
            color: #d4af37 !important;
            font-family: Arial, sans-serif !important;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #d4af37 !important;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
            text-align: center;
        }
        .dato {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #ffffff;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        a {
            color: #d4af37 !important;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Panel de Datos</h1>
    {% for linea in datos %}
        <div class="dato">{{ linea }}</div>
    {% endfor %}
    <a href="/logout">Cerrar Sesión</a>
</body>
</html>
